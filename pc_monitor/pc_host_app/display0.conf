[main]
ip_address: 192.168.1.45
id: 1
width: 1200
height: 825
x_offset: 1920
y_offset: 0
rotation: 180
grey_monochrome_threshold: 200
sleep_time: 5
refresh_every_x_frames: 0
draws_conf: {
    "draw_list": [
        {"type": "black_and_white", "rmt_high_times": [200, 200,200, 200,200, 200]}
   
     ]
     }
enable_skipping: 1
epd_skip_threshold: 8000
epd_skip_mouse_only: 1
mode: monochrome
